name: Deploy to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_node_modules:
        description: 'Force upload server node_modules (ช้า — ใช้เมื่อ deps เปลี่ยนหรือ server ขาดไฟล์)'
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect dependency changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            deps:
              - 'package.json'
              - 'package-lock.json'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (with duplicate-import guard)
        run: npm run test:build
        env:
          NODE_ENV: production
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy/.output
          cp -r .output/* deploy/.output/
          cp plesk/app.cjs plesk/ping.cjs package.json .node-version .nvmrc deploy/.output/

      - name: Verify server dependencies in bundle
        run: |
          test -d deploy/.output/server/node_modules/@supabase/supabase-js
          echo "server node_modules files: $(find deploy/.output/server/node_modules -type f | wc -l)"

      - name: Pack server deps (manual fallback zip)
        run: |
          cd deploy/.output/server
          zip -r -q ../../../server-node_modules.zip node_modules

      - name: Upload deps zip (download จาก Actions ถ้า SFTP ไม่ครบ)
        uses: actions/upload-artifact@v4
        with:
          name: server-node_modules
          path: server-node_modules.zip
          retention-days: 7

      - name: Verify Nuxt public assets in bundle
        run: |
          CHUNKS=$(find deploy/.output/public/_nuxt -maxdepth 1 -name '*.js' ! -name '*.gz' | wc -l)
          echo "Nuxt JS chunks in bundle: $CHUNKS"
          test "$CHUNKS" -ge 20
          ENTRY=$(grep -oE '/_nuxt/[^"]+\.js' deploy/.output/public/index.html 2>/dev/null | head -1 || true)
          if [ -z "$ENTRY" ]; then
            ENTRY="/_nuxt/$(find deploy/.output/public/_nuxt -maxdepth 1 -name '*.js' ! -name '*.gz' -printf '%f\n' | head -1)"
          fi
          test -f "deploy/.output/public${ENTRY}"
          echo "Entry chunk for smoke test: $ENTRY"
          echo "DEPLOY_NUXT_CHUNK=$ENTRY" >> "$GITHUB_ENV"

      - name: Deploy Nuxt client assets (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/.output/public/_nuxt/
          server-dir: httpdocs/.output/public/_nuxt/
          timeout: 600000
          log-level: minimal
          security: loose
          dangerous-clean-slate: false

      - name: Deploy app to Plesk (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/
          server-dir: httpdocs/
          timeout: 600000
          log-level: minimal
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.output/public/_nuxt/**

      - name: Smoke test production _nuxt
        run: |
          BASE="https://www.wplandproperty.com"
          CHUNK="${DEPLOY_NUXT_CHUNK}"
          if [ -z "$CHUNK" ]; then
            echo "DEPLOY_NUXT_CHUNK not set"
            exit 1
          fi
          echo "Smoke test chunk from bundle: $CHUNK"
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Attempt $attempt/8 (wait 15s between retries)"
            if [ "$attempt" -gt 1 ]; then
              sleep 15
            else
              sleep 20
            fi
            if ! HEADERS=$(curl -fsSI -H 'accept-encoding: identity' "$BASE$CHUNK" 2>&1); then
              echo "$HEADERS"
              continue
            fi
            echo "$HEADERS"
            if echo "$HEADERS" | grep -qi 'x-powered-by: phusion passenger'; then
              echo "WARN: _nuxt routed through Passenger — retry (Document root ควรเป็น httpdocs/.output/public)"
              continue
            fi
            if ! echo "$HEADERS" | grep -qi 'javascript'; then
              echo "WARN: not served as JavaScript — retry"
              continue
            fi
            if curl -fsS -H 'accept-encoding: identity' "$BASE$CHUNK" | head -c 5 | grep -q .; then
              echo "OK: $CHUNK"
              curl -fsS "$BASE/admin" > /dev/null && echo "OK: /admin"
              exit 0
            fi
          done
          echo "FAIL: $CHUNK not ready after retries"
          exit 1

      - name: Deploy server node_modules (FTPS)
        if: steps.changes.outputs.deps == 'true' || (github.event_name == 'workflow_dispatch' && inputs.upload_node_modules)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/.output/server/node_modules/
          server-dir: httpdocs/.output/server/node_modules/
          timeout: 600000
          log-level: minimal
          security: loose
          dangerous-clean-slate: false
